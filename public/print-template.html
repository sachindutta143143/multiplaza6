<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Print Bill</title>
  <style>
    @page { size: A4; margin: 15mm; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1e293b; margin: 0; padding: 20px; }
    .header { border-bottom: 2px solid #0f3d63; padding-bottom: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-start; }
    .shop-title { font-size: 24px; font-weight: 900; color: #0b2f4f; margin: 0; }
    .shop-tagline { font-size: 12px; color: #64748b; margin-top: 4px; }
    .bill-meta { text-align: right; font-size: 13px; line-height: 1.6; }
    .bill-meta b { font-size: 15px; color: #0b2f4f; }
    .customer-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; font-size: 13px; display: flex; justify-content: space-between; }
    .customer-box b { color: #0f172a; font-size: 14px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 13px; }
    th { background: #0f3d63; color: #fff; padding: 10px 12px; text-align: left; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
    th.num, td.num { text-align: right; }
    td { padding: 10px 12px; border-bottom: 1px solid #e2e8f0; }
    .total-box { margin-left: auto; width: 280px; font-size: 13px; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; margin-bottom: 30px; }
    .total-row { display: flex; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #f1f5f9; }
    .total-row.grand { background: #f8fafc; font-weight: 900; font-size: 15px; color: #0b2f4f; border-top: 2px solid #cbd5e1; }
    .footer { border-top: 1px dashed #cbd5e1; padding-top: 12px; text-align: center; font-size: 11px; color: #64748b; margin-top: 40px; }
  </style>
</head>
<body>
  <div id="content"></div>
</body>
</html>
